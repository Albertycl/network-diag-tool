name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/albertycl/network-diag-tool

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend import check
        run: |
          for d in backend for_user/backend; do
            pip install -q -r $d/requirements.txt
            (cd $d && DATABASE_URL=sqlite:// python -c "import app")
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend build check
        run: |
          for d in frontend for_user/frontend; do
            (cd $d && npm ci --no-audit --no-fund && npm run build)
          done

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: admin-backend,  context: backend,           build_args: "PORT=5425" }
          - { name: admin-frontend, context: frontend,          build_args: "" }
          - { name: user-backend,   context: for_user/backend,  build_args: "PORT=5427" }
          - { name: user-frontend,  context: for_user/frontend, build_args: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  update-gitops:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out gitops-apps
        uses: actions/checkout@v4
        with:
          repository: Albertycl/gitops-apps
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops
      - name: Set new image tags
        working-directory: gitops/manifests/network-diag-tool
        run: |
          for n in admin-backend admin-frontend user-backend user-frontend; do
            kustomize edit set image \
              ghcr.io/albertycl/network-diag-tool-$n=ghcr.io/albertycl/network-diag-tool-$n:${{ github.sha }}
          done
      - name: Commit and push
        working-directory: gitops
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "network-diag-tool: deploy ${GITHUB_SHA::7}"
          git push
